services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: smartfuel, POSTGRES_USER: smartfuel, POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in .env}" }
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment: { SPRING_PROFILES_ACTIVE: postgres, DB_URL: "jdbc:postgresql://db:5432/smartfuel", DB_USER: smartfuel, DB_PASSWORD: "${DB_PASSWORD}", SMARTFUEL_JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET in .env}" }
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
volumes: { pgdata: {} }
